server.port=8080
spring.application.name=prm3-backend

# ===================================================================
# 1. MICROSOFT SQL SERVER CONFIGURATION (ACTIVE DEFAULT)
# ===================================================================
# Yêu cầu: Trong SSMS chỉ cần chạy lệnh: CREATE DATABASE LiverpoolPMS;
# Cấu hình chuỗi kết nối SQL Server (Cổng mặc định: 1433):
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=LiverpoolPMS;encrypt=true;trustServerCertificate=true
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=123456

# Cấu hình Hibernate JPA tự động sinh bảng & cập nhật cấu trúc
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# 2. H2 SQL RELATIONAL DATABASE (DỰ PHÒNG KHI MÁY KHÔNG CÓ SQL SERVER)
# ===================================================================
# Khi muốn chạy không cần cài SQL Server, bỏ comment các dòng bên dưới:
# spring.datasource.url=jdbc:h2:file:./data/liverpool_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# Multipart configuration for contract uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Data directory configuration
app.data.file=data/players.json
app.data.campaigns-file=data/campaigns.json
app.data.sponsorships-file=data/sponsorships.json
app.data.contracts-directory=data/contracts
